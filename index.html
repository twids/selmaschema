<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Co-Parenting Calendar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .controls {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }

        .controls label {
            font-weight: 600;
            color: #495057;
        }

        .controls input,
        .controls select,
        .controls button {
            padding: 10px 15px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 14px;
        }

        .controls button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .controls button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .legend {
            padding: 20px 30px;
            background: #fff;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            align-items: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .legend-color {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            border: 2px solid #dee2e6;
        }

        .parent-a {
            background: #e3f2fd;
            border-color: #2196f3;
        }

        .parent-b {
            background: #fce4ec;
            border-color: #e91e63;
        }

        .unassigned {
            background: #f5f5f5;
            border-color: #9e9e9e;
        }

        .vab-day {
            background: #fff9c4 !important;
            border-color: #fbc02d !important;
        }

        .calendar-container {
            padding: 30px;
        }

        .month-section {
            margin-bottom: 40px;
        }

        .month-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }

        .month-header h2 {
            color: #667eea;
            font-size: 1.8em;
        }

        .month-actions {
            display: flex;
            gap: 10px;
        }

        .month-actions button {
            padding: 8px 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .month-actions button:hover {
            background: #5568d3;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        .day-header {
            text-align: center;
            font-weight: 700;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
            color: #495057;
        }

        .day-cell {
            background: #f5f5f5;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            padding: 10px;
            min-height: 100px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .day-cell:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .day-cell.parent-a {
            background: #e3f2fd;
            border-color: #2196f3;
        }

        .day-cell.parent-b {
            background: #fce4ec;
            border-color: #e91e63;
        }

        .day-cell.vab-day {
            border: 3px solid #fbc02d;
        }

        .day-cell.vab-day::after {
            content: 'VAB';
            position: absolute;
            top: 5px;
            right: 5px;
            background: #fbc02d;
            color: #000;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
        }

        .day-number {
            font-weight: 700;
            font-size: 1.2em;
            margin-bottom: 5px;
            color: #212529;
        }

        .day-parent {
            font-size: 0.9em;
            color: #495057;
            margin-bottom: 5px;
        }

        .day-comment {
            font-size: 0.85em;
            color: #6c757d;
            font-style: italic;
            margin-top: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e9ecef;
        }

        .modal-header h3 {
            color: #667eea;
            font-size: 1.5em;
        }

        .modal-body label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
            color: #495057;
            margin-bottom: 5px;
        }

        .modal-body input,
        .modal-body select,
        .modal-body textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 14px;
        }

        .modal-body textarea {
            resize: vertical;
            min-height: 80px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-save {
            background: #667eea;
            color: white;
        }

        .btn-save:hover {
            background: #5568d3;
        }

        .btn-cancel {
            background: #6c757d;
            color: white;
        }

        .btn-cancel:hover {
            background: #5a6268;
        }

        .empty-day {
            opacity: 0.3;
        }

        .stats {
            padding: 20px 30px;
            background: #f8f9fa;
            border-top: 2px solid #e9ecef;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.9em;
            color: #6c757d;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .calendar-grid {
                grid-template-columns: repeat(7, 1fr);
                gap: 5px;
            }

            .day-cell {
                min-height: 80px;
                padding: 5px;
                font-size: 0.9em;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .controls input,
            .controls select,
            .controls button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Co-Parenting Calendar</h1>
            <p>Manage your 50/50 parenting schedule</p>
        </div>

        <div class="controls">
            <label for="yearSelect">Year:</label>
            <select id="yearSelect"></select>
            
            <label for="parentAName">Parent A:</label>
            <input type="text" id="parentAName" placeholder="Parent A name" value="Parent A">
            
            <label for="parentBName">Parent B:</label>
            <input type="text" id="parentBName" placeholder="Parent B name" value="Parent B">
            
            <button onclick="updateParentNames()">Update Names</button>
            <button onclick="exportData()">Export Data</button>
            <button onclick="importData()">Import Data</button>
            <input type="file" id="importFile" style="display: none;" accept=".json">
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color parent-a"></div>
                <span id="legendParentA">Parent A</span>
            </div>
            <div class="legend-item">
                <div class="legend-color parent-b"></div>
                <span id="legendParentB">Parent B</span>
            </div>
            <div class="legend-item">
                <div class="legend-color unassigned"></div>
                <span>Unassigned</span>
            </div>
            <div class="legend-item">
                <div class="legend-color vab-day"></div>
                <span>VAB (Child Care Leave)</span>
            </div>
        </div>

        <div class="calendar-container" id="calendarContainer"></div>

        <div class="stats" id="stats"></div>
    </div>

    <!-- Day Edit Modal -->
    <div class="modal" id="dayModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Edit Day</h3>
            </div>
            <div class="modal-body">
                <label for="dayParent">Assigned to:</label>
                <select id="dayParent">
                    <option value="">Unassigned</option>
                    <option value="parentA">Parent A</option>
                    <option value="parentB">Parent B</option>
                </select>

                <label for="dayVAB">
                    <input type="checkbox" id="dayVAB" style="width: auto; margin-right: 5px;">
                    Mark as VAB (Child Care Leave)
                </label>

                <label for="dayComment">Comment:</label>
                <textarea id="dayComment" placeholder="Add notes or comments for this day..."></textarea>

                <div class="modal-actions">
                    <button class="btn-save" onclick="saveDay()">Save</button>
                    <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let currentYear = new Date().getFullYear();
        let calendarData = {};
        let parentNames = {
            parentA: 'Parent A',
            parentB: 'Parent B'
        };
        let currentEditingDate = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            initializeYearSelector();
            renderCalendar();
            updateStats();
        });

        // Initialize year selector
        function initializeYearSelector() {
            const yearSelect = document.getElementById('yearSelect');
            const currentYear = new Date().getFullYear();
            
            for (let year = currentYear - 2; year <= currentYear + 5; year++) {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                if (year === currentYear) {
                    option.selected = true;
                }
                yearSelect.appendChild(option);
            }

            yearSelect.addEventListener('change', function() {
                currentYear = parseInt(this.value);
                renderCalendar();
                updateStats();
            });
        }

        // Load data from localStorage
        function loadData() {
            const savedData = localStorage.getItem('coParentingCalendar');
            if (savedData) {
                const data = JSON.parse(savedData);
                calendarData = data.calendarData || {};
                parentNames = data.parentNames || parentNames;
                
                document.getElementById('parentAName').value = parentNames.parentA;
                document.getElementById('parentBName').value = parentNames.parentB;
                updateLegend();
            }
        }

        // Save data to localStorage
        function saveData() {
            const data = {
                calendarData: calendarData,
                parentNames: parentNames
            };
            localStorage.setItem('coParentingCalendar', JSON.stringify(data));
        }

        // Update parent names
        function updateParentNames() {
            parentNames.parentA = document.getElementById('parentAName').value || 'Parent A';
            parentNames.parentB = document.getElementById('parentBName').value || 'Parent B';
            updateLegend();
            saveData();
            renderCalendar();
        }

        // Update legend with parent names
        function updateLegend() {
            document.getElementById('legendParentA').textContent = parentNames.parentA;
            document.getElementById('legendParentB').textContent = parentNames.parentB;
        }

        // Get days in month
        function getDaysInMonth(year, month) {
            return new Date(year, month + 1, 0).getDate();
        }

        // Get first day of month (0 = Sunday)
        function getFirstDayOfMonth(year, month) {
            return new Date(year, month, 1).getDay();
        }

        // Format date as key
        function getDateKey(year, month, day) {
            return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        }

        // Render calendar
        function renderCalendar() {
            const container = document.getElementById('calendarContainer');
            container.innerHTML = '';

            const monthNames = [
                'January', 'February', 'March', 'April', 'May', 'June',
                'July', 'August', 'September', 'October', 'November', 'December'
            ];

            const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

            for (let month = 0; month < 12; month++) {
                const monthSection = document.createElement('div');
                monthSection.className = 'month-section';

                const monthHeader = document.createElement('div');
                monthHeader.className = 'month-header';
                monthHeader.innerHTML = `
                    <h2>${monthNames[month]} ${currentYear}</h2>
                    <div class="month-actions">
                        <button onclick="fillMonth(${month}, 'parentA')">Fill ${parentNames.parentA}</button>
                        <button onclick="fillMonth(${month}, 'parentB')">Fill ${parentNames.parentB}</button>
                        <button onclick="alternateMonth(${month})">Alternate Days</button>
                    </div>
                `;
                monthSection.appendChild(monthHeader);

                const calendarGrid = document.createElement('div');
                calendarGrid.className = 'calendar-grid';

                // Add day headers
                dayNames.forEach(day => {
                    const dayHeader = document.createElement('div');
                    dayHeader.className = 'day-header';
                    dayHeader.textContent = day;
                    calendarGrid.appendChild(dayHeader);
                });

                const daysInMonth = getDaysInMonth(currentYear, month);
                const firstDay = getFirstDayOfMonth(currentYear, month);

                // Add empty cells for days before month starts
                for (let i = 0; i < firstDay; i++) {
                    const emptyCell = document.createElement('div');
                    emptyCell.className = 'day-cell empty-day';
                    calendarGrid.appendChild(emptyCell);
                }

                // Add day cells
                for (let day = 1; day <= daysInMonth; day++) {
                    const dateKey = getDateKey(currentYear, month, day);
                    const dayData = calendarData[dateKey] || {};

                    const dayCell = document.createElement('div');
                    dayCell.className = 'day-cell';
                    
                    if (dayData.parent === 'parentA') {
                        dayCell.classList.add('parent-a');
                    } else if (dayData.parent === 'parentB') {
                        dayCell.classList.add('parent-b');
                    }

                    if (dayData.isVAB) {
                        dayCell.classList.add('vab-day');
                    }

                    const parentLabel = dayData.parent === 'parentA' ? parentNames.parentA :
                                       dayData.parent === 'parentB' ? parentNames.parentB : 'Unassigned';

                    dayCell.innerHTML = `
                        <div class="day-number">${day}</div>
                        <div class="day-parent">${parentLabel}</div>
                        ${dayData.comment ? `<div class="day-comment">${dayData.comment}</div>` : ''}
                    `;

                    dayCell.onclick = () => openDayModal(dateKey, day, monthNames[month]);
                    calendarGrid.appendChild(dayCell);
                }

                monthSection.appendChild(calendarGrid);
                container.appendChild(monthSection);
            }

            updateLegend();
        }

        // Open day edit modal
        function openDayModal(dateKey, day, monthName) {
            currentEditingDate = dateKey;
            const dayData = calendarData[dateKey] || {};

            document.getElementById('modalTitle').textContent = `${monthName} ${day}, ${currentYear}`;
            document.getElementById('dayParent').value = dayData.parent || '';
            document.getElementById('dayVAB').checked = dayData.isVAB || false;
            document.getElementById('dayComment').value = dayData.comment || '';

            // Update parent select options with current names
            const parentSelect = document.getElementById('dayParent');
            parentSelect.innerHTML = `
                <option value="">Unassigned</option>
                <option value="parentA">${parentNames.parentA}</option>
                <option value="parentB">${parentNames.parentB}</option>
            `;
            parentSelect.value = dayData.parent || '';

            document.getElementById('dayModal').classList.add('active');
        }

        // Close modal
        function closeModal() {
            document.getElementById('dayModal').classList.remove('active');
            currentEditingDate = null;
        }

        // Save day data
        function saveDay() {
            if (!currentEditingDate) return;

            const parent = document.getElementById('dayParent').value;
            const isVAB = document.getElementById('dayVAB').checked;
            const comment = document.getElementById('dayComment').value.trim();

            if (!parent && !isVAB && !comment) {
                delete calendarData[currentEditingDate];
            } else {
                calendarData[currentEditingDate] = {
                    parent: parent,
                    isVAB: isVAB,
                    comment: comment
                };
            }

            saveData();
            closeModal();
            renderCalendar();
            updateStats();
        }

        // Fill entire month with one parent
        function fillMonth(month, parent) {
            const daysInMonth = getDaysInMonth(currentYear, month);
            
            for (let day = 1; day <= daysInMonth; day++) {
                const dateKey = getDateKey(currentYear, month, day);
                const existing = calendarData[dateKey] || {};
                calendarData[dateKey] = {
                    ...existing,
                    parent: parent
                };
            }

            saveData();
            renderCalendar();
            updateStats();
        }

        // Alternate days in month
        function alternateMonth(month) {
            const daysInMonth = getDaysInMonth(currentYear, month);
            
            for (let day = 1; day <= daysInMonth; day++) {
                const dateKey = getDateKey(currentYear, month, day);
                const existing = calendarData[dateKey] || {};
                const parent = day % 2 === 1 ? 'parentA' : 'parentB';
                calendarData[dateKey] = {
                    ...existing,
                    parent: parent
                };
            }

            saveData();
            renderCalendar();
            updateStats();
        }

        // Update statistics
        function updateStats() {
            let parentADays = 0;
            let parentBDays = 0;
            let vabDays = 0;
            let commentedDays = 0;

            const daysInYear = isLeapYear(currentYear) ? 366 : 365;

            for (let month = 0; month < 12; month++) {
                const daysInMonth = getDaysInMonth(currentYear, month);
                for (let day = 1; day <= daysInMonth; day++) {
                    const dateKey = getDateKey(currentYear, month, day);
                    const dayData = calendarData[dateKey];

                    if (dayData) {
                        if (dayData.parent === 'parentA') parentADays++;
                        if (dayData.parent === 'parentB') parentBDays++;
                        if (dayData.isVAB) vabDays++;
                        if (dayData.comment) commentedDays++;
                    }
                }
            }

            const statsContainer = document.getElementById('stats');
            statsContainer.innerHTML = `
                <div class="stat-item">
                    <div class="stat-value">${parentADays}</div>
                    <div class="stat-label">${parentNames.parentA} Days</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${parentBDays}</div>
                    <div class="stat-label">${parentNames.parentB} Days</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${vabDays}</div>
                    <div class="stat-label">VAB Days</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${commentedDays}</div>
                    <div class="stat-label">Days with Comments</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${daysInYear - parentADays - parentBDays}</div>
                    <div class="stat-label">Unassigned Days</div>
                </div>
            `;
        }

        // Check if leap year
        function isLeapYear(year) {
            return (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
        }

        // Export data
        function exportData() {
            const data = {
                calendarData: calendarData,
                parentNames: parentNames,
                exportDate: new Date().toISOString()
            };

            const dataStr = JSON.stringify(data, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = `coparenting-calendar-${currentYear}.json`;
            link.click();
            
            URL.revokeObjectURL(url);
        }

        // Import data
        function importData() {
            document.getElementById('importFile').click();
        }

        document.getElementById('importFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const data = JSON.parse(event.target.result);
                    if (data.calendarData) {
                        calendarData = data.calendarData;
                    }
                    if (data.parentNames) {
                        parentNames = data.parentNames;
                        document.getElementById('parentAName').value = parentNames.parentA;
                        document.getElementById('parentBName').value = parentNames.parentB;
                    }
                    saveData();
                    renderCalendar();
                    updateStats();
                    alert('Data imported successfully!');
                } catch (error) {
                    alert('Error importing data: ' + error.message);
                }
            };
            reader.readAsText(file);
            
            // Reset file input
            e.target.value = '';
        });

        // Close modal on outside click
        document.getElementById('dayModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Close modal on Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
