services:
  # PostgreSQL Database (internal only)
  selmadb:
    image: postgres:16-alpine
    container_name: coparenting-db
    labels:
      - dockhand.update=false
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - coparenting-network

  # Combined Backend API + Frontend (prebuilt image)
  app:
    image: ${APP_IMAGE:-ghcr.io/twids/selmaschema/coparenting-app:latest}
    pull_policy: always
    container_name: coparenting-app
    labels:
      - dockhand.update=true
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${ASPNETCORE_URLS}
      - ConnectionStrings__DefaultConnection=Host=selmadb;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Database__ApplyMigrations=true
      - Oidc__Authority=${OIDC_AUTHORITY}
      - Oidc__ClientId=${OIDC_CLIENT_ID}
      - Oidc__ClientSecret=${OIDC_CLIENT_SECRET}
      - Oidc__CallbackPath=${OIDC_CALLBACK_PATH:-/signin-oidc}
      - Auth__LocalAdmin__Enabled=${LOCAL_ADMIN_ENABLED}
      - Auth__LocalAdmin__PasswordHash=${LOCAL_ADMIN_PASSWORD_HASH}
      - ForwardedHeaders__KnownNetworks__0=${FORWARDED_HEADERS_KNOWN_NETWORK}
    ports:
      - "3000:8080"
    depends_on:
      selmadb:
        condition: service_healthy
    networks:
      - coparenting-network
      - nginx
    restart: unless-stopped

volumes:
  postgres-data:


networks:
  coparenting-network:
    driver: bridge
  nginx:
    external: true
