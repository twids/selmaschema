# Development override for docker-compose.yml
# Use: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # Backend API with hot reload and debugging support
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      target: development
    container_name: coparenting-api-dev
    volumes:
      # Mount source code for hot reload
      - ./backend:/src
      # Note: bin and obj directories will be managed by dotnet watch
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER=1
      # Enable debugging
      - VSDBG_PATH=/vsdbg
      - ConnectionStrings__DefaultConnection=Host=selmadb;Database=CoParentingCalendar;Username=postgres;Password=YourStrong@Passw0rd
    ports:
      - "8080:8080"
    depends_on:
      selmadb:
        condition: service_healthy
    networks:
      - coparenting-network
    working_dir: /src/CoParenting.API
    command: sh -c "ls -la && dotnet watch run --no-launch-profile"

  # Frontend with hot reload (Vite dev server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      target: development
    container_name: coparenting-frontend-dev
    volumes:
      # Mount source code for hot reload
      - ./frontend:/app
      # Preserve node_modules in anonymous volume for performance
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8080
    ports:
      - "5173:5173" # Vite dev server default port
    networks:
      - coparenting-network
    command: npm run dev -- --host 0.0.0.0

  # Override the app service to not start in dev mode
  app:
    command: echo "Dev mode uses separate api and frontend services"
    restart: "no"
    ports: []
