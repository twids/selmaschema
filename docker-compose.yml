services:
  # PostgreSQL Database
  selmadb:
    image: postgres:16-alpine
    container_name: coparenting-db
    environment:
      - POSTGRES_DB=CoParentingCalendar
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=YourStrong@Passw0rd
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d CoParentingCalendar"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - coparenting-network

  # Combined Backend API + Frontend
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coparenting-app
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=selmadb;Database=CoParentingCalendar;Username=postgres;Password=YourStrong@Passw0rd
    ports:
      - "3000:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - coparenting-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  coparenting-network:
    driver: bridge
