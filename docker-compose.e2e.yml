services:
  selmadb:
    image: postgres:16-alpine
    container_name: coparenting-e2e-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-CoParentingCalendar}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-e2e-postgres-password}
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-CoParentingCalendar}" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - coparenting-e2e-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coparenting-e2e-app
    environment:
      - ASPNETCORE_ENVIRONMENT=EndToEnd
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=selmadb;Database=${POSTGRES_DB:-CoParentingCalendar};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-e2e-postgres-password}
      - Database__ApplyMigrations=true
      - Database__AllowDestructiveV2Reset=true
      - Oidc__Authority=${OIDC_AUTHORITY:-https://id.example.test}
      - Oidc__ClientId=${OIDC_CLIENT_ID:-selma-e2e}
      - Oidc__ClientSecret=${OIDC_CLIENT_SECRET:-e2e-not-a-secret}
      - Oidc__CallbackPath=/signin-oidc
      - AdminOidc__Authority=${ADMIN_OIDC_AUTHORITY:-https://id.example.test}
      - AdminOidc__ClientId=${ADMIN_OIDC_CLIENT_ID:-selma-admin-e2e}
      - AdminOidc__ClientSecret=${ADMIN_OIDC_CLIENT_SECRET:-e2e-not-a-secret}
      - AdminOidc__CallbackPath=/signin-oidc-admin
      - AdminOidc__RequiredGroup=selma-platform-admins
      - Auth__BreakGlass__Enabled=true
      - Auth__BreakGlass__PasswordHash=${BREAK_GLASS_ADMIN_PASSWORD_HASH}
      - EndToEnd__LoginSecret=${E2E_LOGIN_SECRET:-e2e-login-secret}
      - ForwardedHeaders__KnownNetworks__0=172.16.0.0/12
    ports:
      - "3000:8080"
    depends_on:
      selmadb:
        condition: service_healthy
    networks:
      - coparenting-e2e-network

networks:
  coparenting-e2e-network:
