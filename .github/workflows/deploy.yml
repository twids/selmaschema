name: Build and Deploy to Portainer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  STACK_NAME: selmaschema
  PORTAINER_URL: ${{ vars.PORTAINER_URL }}
  DEFAULT_PORTAINER_URL: https://portainer.widsell.nu
  POSTGRES_DB: CoParentingCalendar
  POSTGRES_USER: postgres
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:8080

jobs:
  build:
    name: Build and push image to GHCR
    runs-on: ubuntu-latest
    outputs:
      app_image: ${{ steps.meta.outputs.app_image }}
      migrator_image: ${{ steps.meta.outputs.migrator_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dotnet-ef CLI
        run: |
          dotnet tool install --global dotnet-ef
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Restore solution
        run: dotnet restore selmaschema.sln

      - name: Create EF migrations bundle (linux-x64)
        run: |
          dotnet ef migrations bundle \
            --project backend/CoParenting.Infrastructure/CoParenting.Infrastructure.csproj \
            --startup-project backend/CoParenting.API/CoParenting.API.csproj \
            --output backend/migrator/efbundle \
            --self-contained \
            --target-runtime linux-x64

      - name: Build and push app image
        id: build_app
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/selmaschema-app:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/selmaschema-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image output
        id: meta
        run: |
          echo "app_image=ghcr.io/${{ github.repository_owner }}/selmaschema-app:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "migrator_image=ghcr.io/${{ github.repository_owner }}/selmaschema-migrator:${{ github.sha }}" >> $GITHUB_OUTPUT
      
      - name: Build and push migrator image
        id: build_migrator
        uses: docker/build-push-action@v5
        with:
          context: backend/migrator
          file: backend/migrator/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/selmaschema-migrator:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/selmaschema-migrator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy stack to Portainer
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure dependencies (jq)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Resolve Portainer endpoint ID
        id: endpoint
        env:
          API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set -euo pipefail
          BASE_URL="${PORTAINER_URL:-$DEFAULT_PORTAINER_URL}"
          echo "Using Portainer URL: $BASE_URL"
          if [ -n "${{ vars.PORTAINER_ENDPOINT_ID }}" ]; then
            echo "endpointId=${{ vars.PORTAINER_ENDPOINT_ID }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          eps=$(curl -sS -H "X-API-Key: $API_KEY" "$BASE_URL/api/endpoints")
          id=$(echo "$eps" | jq -r '.[] | select(.Name=="local") | .Id' | head -n1)
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            id=$(echo "$eps" | jq -r '.[0].Id')
          fi
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "Failed to resolve endpoint ID" >&2
            exit 1
          fi
          echo "endpointId=$id" >> $GITHUB_OUTPUT

      - name: Create or update stack
        env:
          API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
        run: |
          set -euo pipefail
          BASE_URL="${PORTAINER_URL:-$DEFAULT_PORTAINER_URL}"
          ENDPOINT_ID="${{ steps.endpoint.outputs.endpointId }}"
          STACK_NAME="$STACK_NAME"
          APP_IMAGE="${{ needs.build.outputs.app_image }}"
          MIGRATOR_IMAGE="${{ needs.build.outputs.migrator_image }}"
          # Read compose file content directly
          COMPOSE_FILE="docker-compose.prod.yml"
          CONTENT=$(cat "$COMPOSE_FILE")

          # Check if stack exists
          stacks=$(curl -sS -H "X-API-Key: $API_KEY" "$BASE_URL/api/stacks")
          existing=$(echo "$stacks" | jq -r ".[] | select(.Name==\"$STACK_NAME\") | .Id" | head -n1)

          envArr=$(jq -n \
            --arg APP_IMAGE "$APP_IMAGE" \
            --arg MIGRATOR_IMAGE "$MIGRATOR_IMAGE" \
            --arg POSTGRES_DB "$POSTGRES_DB" \
            --arg POSTGRES_USER "$POSTGRES_USER" \
            --arg POSTGRES_PASSWORD "$POSTGRES_PASSWORD" \
            --arg ASPNETCORE_ENVIRONMENT "$ASPNETCORE_ENVIRONMENT" \
            --arg ASPNETCORE_URLS "$ASPNETCORE_URLS" \
            --arg ADMIN_PASSWORD_HASH "$ADMIN_PASSWORD_HASH" \
            '[
               {"name":"APP_IMAGE","value":$APP_IMAGE},
               {"name":"MIGRATOR_IMAGE","value":$MIGRATOR_IMAGE},
               {"name":"POSTGRES_DB","value":$POSTGRES_DB},
               {"name":"POSTGRES_USER","value":$POSTGRES_USER},
               {"name":"POSTGRES_PASSWORD","value":$POSTGRES_PASSWORD},
               {"name":"ASPNETCORE_ENVIRONMENT","value":$ASPNETCORE_ENVIRONMENT},
               {"name":"ASPNETCORE_URLS","value":$ASPNETCORE_URLS},
               {"name":"ADMIN_PASSWORD_HASH","value":$ADMIN_PASSWORD_HASH}
             ]')

          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            echo "Updating existing stack ID=$existing"
            body=$(jq -n --arg StackFileContent "$CONTENT" --argjson Env "$envArr" '{StackFileContent: $StackFileContent, Env: $Env, Prune: true}')
            response=$(curl -sS -w "\n%{http_code}" -X PUT -H "Content-Type: application/json" -H "X-API-Key: $API_KEY" \
              --data "$body" \
              "$BASE_URL/api/stacks/$existing?endpointId=$ENDPOINT_ID")
            http_code=$(echo "$response" | tail -n1)
            body_content=$(echo "$response" | sed '$d')
            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              echo "$body_content" | jq -r '.Name + " (ID=" + (.Id|tostring) + ")"'
            else
              echo "Failed with HTTP $http_code: $body_content"
              exit 1
            fi
          else
            echo "Creating new stack $STACK_NAME"
            body=$(jq -n --arg Name "$STACK_NAME" --arg StackFileContent "$CONTENT" --argjson Env "$envArr" '{Name: $Name, StackFileContent: $StackFileContent, Env: $Env}')
            response=$(curl -sS -w "\n%{http_code}" -X POST -H "Content-Type: application/json" -H "X-API-Key: $API_KEY" \
              --data "$body" \
              "$BASE_URL/api/stacks/create/standalone/string?endpointId=$ENDPOINT_ID")
            http_code=$(echo "$response" | tail -n1)
            body_content=$(echo "$response" | sed '$d')
            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              echo "$body_content" | jq -r '.Name + " (ID=" + (.Id|tostring) + ")"'
            else
              echo "Failed with HTTP $http_code: $body_content"
              exit 1
            fi
          fi
