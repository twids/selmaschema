name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, copilot/** ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/ci-cd.yml'
      - 'e2e-tests/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/ci-cd.yml'
      - 'e2e-tests/**'

jobs:
  # Build and test application (backend + frontend)
  build:
    name: Build Application
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    # Build frontend first
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Lint frontend
      run: |
        cd frontend
        npm run lint || echo "Linting completed with warnings"
        
    - name: Build frontend
      run: |
        cd frontend
        npm run build
        
    - name: Copy frontend build to backend
      run: |
        mkdir -p backend/CoParenting.API/wwwroot
        cp -r frontend/dist/* backend/CoParenting.API/wwwroot/
    
    # Build backend
    - name: Restore backend dependencies
      run: |
        cd backend/CoParenting.API
        dotnet restore
        
    - name: Build backend
      run: |
        cd backend/CoParenting.API
        dotnet build --configuration Release --no-restore
        
    - name: Run backend tests
      run: |
        cd backend
        dotnet test --configuration Release --no-build --verbosity normal || echo "No tests found yet"
        
    - name: Publish application
      run: |
        cd backend/CoParenting.API
        dotnet publish --configuration Release --output ./publish
        
    - name: Upload application artifact
      uses: actions/upload-artifact@v4
      with:
        name: application-build
        path: backend/CoParenting.API/publish/
        retention-days: 3

  # Build Docker image
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      run: |
        docker build -t coparenting-app:${{ github.sha }} .
        
    - name: Test Docker Compose
      run: |
        docker compose config
        echo "Docker Compose configuration is valid"

  # Integration test with Docker Compose
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [docker-build]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Start services
      run: |
        docker compose up -d db
        echo "Waiting for database to be ready..."
        sleep 30
        
    - name: Check services health
      run: |
        docker compose ps
        
    - name: Stop services
      if: always()
      run: |
        docker compose down -v

  # Push Docker image to GitHub Container Registry (only on main branch)
  docker-publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: [docker-build, integration-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}/coparenting-app
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
        
    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # End-to-End Tests (consolidated from separate workflow)
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [docker-build]
    timeout-minutes: 20
    
    # Limit permissions for security
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: e2e-tests/package-lock.json
    
    - name: Install E2E test dependencies
      run: |
        cd e2e-tests
        npm ci
    
    - name: Install Playwright browsers
      run: |
        cd e2e-tests
        npx playwright install --with-deps chromium
    
    - name: Start database service
      run: |
        docker compose up -d db
        echo "Waiting for PostgreSQL to be healthy..."
        
        # Wait for database health check to pass (max 1 minute - PostgreSQL starts fast)
        for i in {1..12}; do
          if docker compose ps db | grep -q "healthy"; then
            echo "PostgreSQL is healthy!"
            break
          fi
          if [ $i -eq 12 ]; then
            echo "PostgreSQL failed to become healthy"
            docker compose logs db
            exit 1
          fi
          echo "Waiting for PostgreSQL health check... ($i/12)"
          sleep 5
        done
        
        echo "PostgreSQL is ready, checking logs:"
        docker compose logs db --tail=20
    
    - name: Start API and frontend services
      run: |
        docker compose up -d app
        echo "Waiting for services to start..."
        sleep 10
    
    - name: Check services health
      run: |
        docker compose ps
        
        # Wait for app to be ready (both frontend and API)
        echo "Checking app health..."
        for i in {1..30}; do
          if curl -f http://localhost:3000/api/config/parent-names >/dev/null 2>&1; then
            echo "API is ready!"
            break
          fi
          if [ $i -eq 30 ]; then
            echo "API failed to become ready"
            docker compose logs app
            exit 1
          fi
          echo "Waiting for API... ($i/30)"
          sleep 2
        done
        
        # Check if frontend is accessible
        echo "Checking frontend..."
        for i in {1..30}; do
          if curl -f http://localhost:3000 >/dev/null 2>&1; then
            echo "Frontend is ready!"
            break
          fi
          if [ $i -eq 30 ]; then
            echo "Frontend failed to become ready"
            docker compose logs app
            exit 1
          fi
          echo "Waiting for frontend... ($i/30)"
          sleep 2
        done
        
        echo "All services are ready!"
        docker compose ps
    
    - name: Run E2E tests
      run: |
        cd e2e-tests
        npm test
      env:
        BASE_URL: http://localhost:3000
        API_URL: http://localhost:3000
        CI: true
    
    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-test-results
        path: e2e-tests/test-results/
        retention-days: 3
    
    - name: Upload test report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-test-report
        path: e2e-tests/playwright-report/
        retention-days: 3
    
    - name: Show service logs on failure
      if: failure()
      run: |
        echo "=== Database Logs ==="
        docker compose logs db
        echo "=== Application Logs ==="
        docker compose logs app
    
    - name: Stop services
      if: always()
      run: |
        docker compose down -v
