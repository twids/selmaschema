name: E2E Tests

on:
  workflow_dispatch:
  push:
    branches: [ main, develop, copilot/**, dependabot/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    # Limit permissions for security
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: e2e-tests/package-lock.json
    
    - name: Install E2E test dependencies
      run: |
        cd e2e-tests
        npm ci
    
    - name: Install Playwright browsers
      run: |
        cd e2e-tests
        npx playwright install --with-deps chromium
    
    - name: Start database service
      run: |
        docker compose up -d selmadb
        echo "Waiting for PostgreSQL to be healthy..."
        
        # Wait for database health check to pass (max 1 minute - PostgreSQL starts fast)
        for i in {1..12}; do
          if docker compose ps selmadb | grep -q "healthy"; then
            echo "PostgreSQL is healthy!"
            break
          fi
          if [ $i -eq 12 ]; then
            echo "PostgreSQL failed to become healthy"
            docker compose logs selmadb
            exit 1
          fi
          echo "Waiting for PostgreSQL health check... ($i/12)"
          sleep 5
        done
        
        echo "PostgreSQL is ready, checking logs:"
        docker compose logs selmadb --tail=20
    
    - name: Start API and frontend services
      run: |
        docker compose up -d app
        echo "Waiting for services to start..."
        sleep 10
    
    - name: Check services health
      run: |
        docker compose ps
        
        # Wait for app to be ready (both frontend and API)
        echo "Checking app health..."
        for i in {1..30}; do
          if curl -f http://localhost:3000/api/config/parent-names >/dev/null 2>&1; then
            echo "API is ready!"
            break
          fi
          if [ $i -eq 30 ]; then
            echo "API failed to become ready"
            docker compose logs app
            exit 1
          fi
          echo "Waiting for API... ($i/30)"
          sleep 2
        done
        
        # Check if frontend is accessible
        echo "Checking frontend..."
        for i in {1..30}; do
          if curl -f http://localhost:3000 >/dev/null 2>&1; then
            echo "Frontend is ready!"
            break
          fi
          if [ $i -eq 30 ]; then
            echo "Frontend failed to become ready"
            docker compose logs app
            exit 1
          fi
          echo "Waiting for frontend... ($i/30)"
          sleep 2
        done
        
        echo "All services are ready!"
        docker compose ps
    
    - name: Run E2E tests
      run: |
        cd e2e-tests
        npm test
      env:
        BASE_URL: http://localhost:3000
        API_URL: http://localhost:3000
        CI: true
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-test-results
        path: e2e-tests/test-results/
        retention-days: 7
    
    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-test-report
        path: e2e-tests/playwright-report/
        retention-days: 7
    
    - name: Show service logs on failure
      if: failure()
      run: |
        echo "=== Database Logs ==="
        docker compose logs selmadb
        echo "=== Application Logs ==="
        docker compose logs app
    
    - name: Stop services
      if: always()
      run: |
        docker compose down -v
